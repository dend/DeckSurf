name: Release App

# The desktop app has its own version track: app-a.b.c tags release the
# MSI, while bare a.b.c tags remain the CLI's NuGet track.
on:
  push:
    tags:
    - "app-[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Verify commit exists in origin/main
      shell: bash
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main
    - name: Set VERSION variable from tag
      shell: bash
      run: echo "VERSION=${GITHUB_REF_NAME#app-}" >> $GITHUB_ENV
    - name: Build MSI
      run: .\scripts\build-installer.ps1 -Version "${{ env.VERSION }}"
    - name: Stage release asset
      shell: pwsh
      run: |
        $msi = Get-ChildItem src/DeckSurf/DeckSurf.Installer/bin -Recurse -Filter DeckSurf.msi | Select-Object -First 1
        Copy-Item $msi.FullName "DeckSurf-${{ env.VERSION }}.msi"
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        gh release create "${{ github.ref_name }}" "DeckSurf-${{ env.VERSION }}.msi" `
          --title "DeckSurf app ${{ env.VERSION }}" `
          --generate-notes
