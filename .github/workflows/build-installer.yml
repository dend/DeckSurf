name: Build Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI product version (a.b.c)'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build MSI
      run: .\scripts\build-installer.ps1 -Version "${{ inputs.version }}"
    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: DeckSurf-msi
        path: src/DeckSurf/DeckSurf.Installer/bin/**/DeckSurf.msi
